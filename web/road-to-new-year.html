<title>Road to New Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#eceae4; --surface-3:#e2e0d9; --text:#191b1f; --muted:#666d78; --faint:#9298a2; --border:#e0ded8;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e6f0fb;
  --orange:#eb6834; --orange-soft:#fdeee7; --aqua:#1baf7a; --aqua-soft:#e3f6ee; --grey:#8a8983;
  --good:#0ca30c; --good-soft:#e5f5e5; --warn:#b45309; --warn-soft:#fbeedd; --bad:#d03b3b; --bad-soft:#fbe7e7;
  --grid:rgba(25,27,31,.09); --shadow:0 1px 2px rgba(25,27,31,.05);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#141517; --surface:#1d1f22; --surface-2:#26292d; --surface-3:#31353a; --text:#f0efec; --muted:#a3a8b1; --faint:#737983; --border:#30343a;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1c2b41; --orange:#d95926; --orange-soft:#3a2317; --aqua:#199e70; --aqua-soft:#15302a; --grey:#8f8e89;
    --good:#3fbf3f; --good-soft:#1c2f1c; --warn:#f0a44a; --warn-soft:#3a2a15; --bad:#e66767; --bad-soft:#3b1f1f; --grid:rgba(240,239,236,.10); --shadow:none; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#141517; --surface:#1d1f22; --surface-2:#26292d; --surface-3:#31353a; --text:#f0efec; --muted:#a3a8b1; --faint:#737983; --border:#30343a;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1c2b41; --orange:#d95926; --orange-soft:#3a2317; --aqua:#199e70; --aqua-soft:#15302a; --grey:#8f8e89;
  --good:#3fbf3f; --good-soft:#1c2f1c; --warn:#f0a44a; --warn-soft:#3a2a15; --bad:#e66767; --bad-soft:#3b1f1f; --grid:rgba(240,239,236,.10); --shadow:none; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:42px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:20px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px}
.faint{color:var(--faint)}
b{font-weight:600}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--grey)}
.chip.on .dot{background:var(--good)}
.trackwrap{margin:16px 0 4px}
.track{position:relative;display:flex;gap:2px;height:12px}
.track .seg{flex:1;background:color-mix(in srgb,var(--accent) 40%,var(--surface-3));border-radius:2px}
.track .seg.past{background:var(--accent)}
.track .seg.future{background:var(--surface-3)}
.track .now{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px;transform:translateX(-50%)}
.tlabels{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.tlabels b{color:var(--text)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 0 8px;margin-top:14px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .rail{display:flex;gap:2px;background:var(--surface-2);padding:4px;border-radius:10px}
.tab{flex:0 0 auto;padding:7px 13px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:7px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);background:var(--surface);box-shadow:var(--shadow)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view[hidden]{display:none}

.sec{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.sec::after{content:'';flex:1;height:1px;background:var(--border);align-self:center}
.sec h2{margin:0}
.sec .sub{white-space:nowrap}
.view > h2{margin:34px 0 12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap}
.kpi .value small{font-size:17px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .delta.up{color:var(--good)} .kpi .delta.down{color:var(--bad)}
.kpi canvas.spark{display:block;width:100%;height:26px;margin-top:6px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card.soft{background:var(--surface-2);border-color:transparent;box-shadow:none}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.card.table{padding:0;overflow:hidden}
.note{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--accent-soft)}
.note.good{background:var(--good-soft)} .note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}
ul.ex{list-style:none;margin:0;padding:0}
ul.ex li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
ul.ex li:last-child{border-bottom:0}
ul.ex li .sub{white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-top:14px}
.mbar i{display:block;height:100%}
.mlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.mlegend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tri{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tri button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;flex:1}
.tri button+button{border-left:1px solid var(--border)}
.tri button[aria-pressed="true"].hit{background:var(--good-soft);color:var(--good)}
.tri button[aria-pressed="true"].mostly{background:var(--warn-soft);color:var(--warn)}
.tri button[aria-pressed="true"].no{background:var(--bad-soft);color:var(--bad)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:40px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;color:var(--muted);padding:0}
.days button i{display:block;width:12px;height:12px;border-radius:50%;background:var(--surface-3)}
.days button.hit i{background:var(--good)} .days button.mostly i{background:var(--warn)} .days button.no i{background:var(--bad)}
.days button.today{border-color:var(--accent)}
.days button:disabled{opacity:.45;cursor:default}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-variant-numeric:tabular-nums}

.chart{position:relative;height:320px;max-width:100%}
.chart.sm{height:220px}

.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.today td{background:var(--accent-soft)}
.tbl tr.current td{font-weight:600}
.tbl .exname{font-weight:500}
.tbl input{width:88px;min-width:70px}
.tbl tr.hint td{padding:4px 10px 10px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.tbl tr.hint td b{color:var(--text)}
.tbl tr.hint .apply{margin-left:6px;padding:1px 8px;font-size:12px}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 160px}
.field.grow{flex:2 1 240px}
label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.quick .field{flex:none}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-top:12px;box-shadow:var(--shadow)}
.timer .clock{font-family:var(--display);font-size:26px;font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.timer.running .clock{color:var(--accent)}
.timer.done .clock{color:var(--good)}
.timer select{width:auto}
details{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:500;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:20px 0}

.pb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--good-soft)}
.star{color:var(--good);font-size:18px;line-height:1}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.adh .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.adh .bar i{display:block;height:100%;background:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.slot.due{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot .ph{aspect-ratio:3/4;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.slot img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.slot .meta{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.compare .cap{font-size:13px;color:var(--muted);margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
@media (max-width:560px){ h1{font-size:34px} h2{font-size:21px} .kpi .value{font-size:27px} .chart{height:260px} .card{padding:14px} .top{align-items:flex-start} }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Road to New Year</h1>
      <div class="sub" id="subline">28 Sep 2026 to 3 Jan 2027 · 14 weeks · lean bulk</div>
    </div>
    <span class="chip" id="storeChip"><span class="dot"></span><span id="storeText">Connecting…</span></span>
  </header>
  <div class="trackwrap" id="track"></div>

  <nav class="tabs" role="tablist" id="tabs"><div class="rail">
    <button class="tab" role="tab" data-tab="dashboard">Dashboard</button>
    <button class="tab" role="tab" data-tab="gym">Log gym</button>
    <button class="tab" role="tab" data-tab="weight">Log weight</button>
    <button class="tab" role="tab" data-tab="progress">Exercise progress</button>
    <button class="tab" role="tab" data-tab="weekly">Weekly review</button>
    <button class="tab" role="tab" data-tab="photos">Photos</button>
    <button class="tab" role="tab" data-tab="data">Data</button>
  </div></nav>

  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-gym" hidden></section>
  <section class="view" id="view-weight" hidden></section>
  <section class="view" id="view-progress" hidden></section>
  <section class="view" id="view-weekly" hidden></section>
  <section class="view" id="view-photos" hidden></section>
  <section class="view" id="view-data" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ===================== The plan ===================== */
const DAY = 86400000;
const P = s => new Date(s + 'T00:00:00Z');
const toIso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => toIso(new Date(P(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((P(a) - P(b)) / DAY);
const weekday = s => (P(s).getUTCDay() + 6) % 7; // Mon = 0
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmt = (s, o) => P(s).toLocaleDateString('en-GB', { timeZone: 'UTC', ...o });
const fShort = s => fmt(s, { day: 'numeric', month: 'short' });
const fDay = s => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
const fLong = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n1 = x => (Math.round(x * 10) / 10).toFixed(1);
const n2 = x => (Math.round(x * 100) / 100).toFixed(2);
const signed = x => (x >= 0 ? '+' : '') + n2(x);

const LEGS = ['Barbell squats', 'RDL', 'Smith single-leg squats', 'Leg extension', 'Hamstring curl', 'Bike'];
const PLAN = {
  start: '2026-09-28', weeks: 14, startKg: 86, gainPerWeek: 0.25, adjust: 200,
  macros: [['Calories', 3700, 'kcal'], ['Protein', 195, 'g'], ['Fat', 90, 'g'], ['Carbs', 530, 'g']],
  carbWins: ['Oats', 'Bagels', 'Bananas', 'Juice', 'Milk'],
  rules: [
    'Weigh every morning and judge by the weekly average, not the daily number.',
    'Target +0.25 kg a week: about 89-90 kg by New Year.',
    'Gaining faster than that? Take about 200 kcal off, from carbs.',
    'No change after two weeks? Add about 200 kcal. Easy carb wins: oats, bagels, bananas, juice, milk.',
    'Barbell squats 4 × 5-8. Everything else 3 sets of 8-12. Add weight once you own the top of the range on every set.',
    'Six sessions a week, Sunday off.',
  ],
  sessions: {
    'Push A': ['Bench press', 'Incline bench', 'Chest fly', 'Shoulder press', 'Cable lateral raise', 'Tricep pushdown', 'Tricep overhead'],
    'Push B': ['Incline bench', 'Chest fly', 'Shoulder press', 'Lateral raise', 'Face pulls', 'Tricep overhead', 'Tricep pushdown'],
    'Pull A': ['Pull-ups', 'Bent-over rows', 'Single-arm DB rows', 'Lat pulldown', 'Cable rows', 'Bicep curl', 'Hammer curl'],
    'Pull B': ['Bent-over rows', 'Tricep pushdown', 'Cable pullovers', 'Bicep curl', 'Cable curl', 'Hammer curl'],
    'Legs A': LEGS, 'Legs B': LEGS,
  },
  gymSchedule: ['Push A', 'Pull A', 'Legs A', 'Push B', 'Pull B', 'Legs B', 'Rest'],
};
PLAN.end = addDays(PLAN.start, PLAN.weeks * 7 - 1);
PLAN.allExercises = [...new Set(Object.values(PLAN.sessions).flat())];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const ISOLATION = ['Chest fly', 'Cable lateral raise', 'Lateral raise', 'Face pulls', 'Tricep pushdown', 'Tricep overhead', 'Bicep curl', 'Hammer curl', 'Cable curl', 'Cable pullovers', 'Leg extension', 'Hamstring curl'];
const repRange = ex => ex === 'Barbell squats' ? [5, 8] : [8, 12];
const increment = ex => ex === 'Pull-ups' ? 0 : (ISOLATION.includes(ex) ? 1 : 2.5);
const defaultSets = ex => ex === 'Barbell squats' ? 4 : 3;
const planOrder = ex => { const i = PLAN.allExercises.indexOf(ex); return i < 0 ? 999 : i; };

const weekNumber = s => s < PLAN.start ? 0 : Math.min(Math.floor(diffDays(s, PLAN.start) / 7) + 1, PLAN.weeks + 1);
const weekDates = w => { const a = addDays(PLAN.start, (w - 1) * 7); return [a, addDays(a, 6)]; };
const planStatus = s => s < PLAN.start ? 'before' : (s > PLAN.end ? 'after' : 'during');
const targetKg = s => PLAN.startKg + PLAN.gainPerWeek * Math.max(0, diffDays(s, PLAN.start)) / 7;
const gymFor = s => PLAN.gymSchedule[weekday(s)];
const sessionId = (date, session) => `${date}_${session.replace(/\s+/g, '-')}`;

/* ===================== State and storage ===================== */
// state.bw     : { "2026-09-28": {kg, sleep?, notes} }
// state.gym    : { "2026-09-28_Push-A": {date, session, sets:[{exercise, set, kg, reps}]} }
// state.macros : { "2026-09-28": "hit" | "mostly" | "no" }
// state.photos : { "<checkpoint date>": {assetId | dataUrl, taken, kg, notes} }
const state = { bw: {}, gym: {}, macros: {}, photos: {} };
const store = { db: null, assets: null, downloads: null };
const LS_KEY = 'road-to-new-year-v1';

function setChip(on, text) { $('storeChip').classList.toggle('on', on); $('storeText').textContent = text; }
function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); ['bw', 'gym', 'macros', 'photos'].forEach(k => { if (o[k]) state[k] = o[k]; }); } } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
async function initStore() {
  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) { loadLocal(); setChip(false, 'Saved in this browser only'); refresh(true); return; }
  store.db = db; setChip(true, 'Saved to your account');
  const onErr = e => { if (e && e.code !== 'unavailable') toast('Live updates stopped. Reload the page to reconnect.'); };
  db.doc('log/bodyweight').onSnapshot(s => { state.bw = (s.exists && s.data().entries) || {}; refresh(); }, onErr);
  db.collection('gym').onSnapshot(qs => { const g = {}; qs.docs.forEach(d => { g[d.id] = d.data(); }); state.gym = g; refresh(); }, onErr);

const timer = { running: false, left: 0, handle: null };
const fmtClock = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
function startTimer() {

  el.classList.add('running'); el.classList.remove('done'); $('tStart').textContent = 'Stop'; $('tClock').textContent = fmtClock(timer.left);
  timer.handle = setInterval(() => { timer.left--; const c = $('tClock'); if (!c) { clearInterval(timer.handle); timer.running = false; return; } c.textContent = fmtClock(Math.max(0, timer.left)); if (timer.left <= 0) stopTimer(true); }, 1000);
}
function stopTimer(finished) {

      ${exercises.map((e, i) => { const b = bests.find(x => x.exercise === e); return `<div class="card"><div class="exhead"><h3 style="margin:0">${esc(e)}</h3><span class="sub">best ${n1(b.kg)} kg × ${b.reps}${recent.has(e) ? ' · <span class="pill good">new best this week</span>' : ''}</span></div><div class="chart sm"><canvas id="ex${i}"></canvas></div></div>`; }).join('')}
    </div>`;
  document.querySelectorAll('.seg [data-m]').forEach(b => b.addEventListener('click', () => { ui.metric = b.dataset.m; renderProgress(); }));
  exercises.forEach((e, i) => exerciseChart('ex' + i, top.filter(r => r.exercise === e), ui.metric));
}

/* ---------- Weekly review ---------- */
function renderWeekly() {
  const today = todayIso(), wk = weekNumber(today), review = weeklyReview(), adh = adherence(today);
  const startAvg = avgBetween(PLAN.start, weekDates(1)[1]), latestAvg = avgBetween(addDays(today, -6), today), m28 = macroRate(addDays(today, -27), today);
  const cell = v => v == null ? '<span class="sub">–</span>' : v;
  $('view-weekly').innerHTML = `
    ${sec('Weekly review', 'all 14 weeks')}
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><div class="label">Change since week 1</div><div class="value">${startAvg != null && latestAvg != null ? signed(latestAvg - startAvg) + ' <small>kg</small>' : '–'}</div></div>
      <div class="kpi"><div class="label">Gym sessions</div><div class="value">${adh ? `${adh.gymDone} <small>/ ${adh.gymPlanned}</small>` : '–'}</div><div class="delta">${adh && adh.gymPlanned ? `${Math.round(100 * adh.gymDone / adh.gymPlanned)}% of planned so far` : 'from 28 Sep'}</div></div>
      <div class="kpi"><div class="label">Macros, last 4 weeks</div><div class="value">${m28.logged ? Math.round(100 * m28.rate) + '<small>%</small>' : '–'}</div><div class="delta">${m28.logged ? `${m28.hit} hit · ${m28.mostly} mostly · ${m28.missed} missed` : 'not marked yet'}</div></div>
      <div class="kpi"><div class="label">Current week</div><div class="value">${wk < 1 ? 'Not started' : (wk > PLAN.weeks ? 'Finished' : `${wk} <small>/ 14</small>`)}</div></div>
    </div>
    <div class="card table tblwrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Week</th><th>Dates</th><th class="num">Avg kg</th><th class="num">Change</th><th class="num">Target</th><th class="num">Gym</th><th class="num">Macros</th><th class="num">Sleep</th></tr></thead><tbody>
      ${review.map(r => `<tr class="${r.w === wk ? 'current' : ''}"><td>${r.w}${r.w === wk ? ' ◀' : ''}</td><td>${fShort(r.a)} – ${fShort(r.b)}</td><td class="num">${cell(r.avg == null ? null : n2(r.avg))}</td><td class="num">${cell(r.change == null ? null : signed(r.change))}</td><td class="num">${n2(r.target)}</td><td class="num">${r.gymN} / 6</td><td class="num" title="${r.macros.hit} hit · ${r.macros.mostly} mostly · ${r.macros.missed} missed">${r.macros.logged ? `${r.macros.hit + r.macros.mostly} / 7` : cell(null)}</td><td class="num">${cell(r.sleep == null ? null : n1(r.sleep) + ' h')}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="sub">Gym counts one session per day. Macros counts days marked hit or mostly. Sleep is the week's average.</p>

    ${adh ? `${sec('Adherence', `${fShort(PLAN.start)} to ${fShort(today < PLAN.end ? today : PLAN.end)}`)}
    <div class="grid2 adh">
      <div class="card"><div class="sub">Gym sessions ${adh.gymDone} / ${adh.gymPlanned}${adh.gymPlanned ? ` · ${Math.round(100 * adh.gymDone / adh.gymPlanned)}%` : ''}</div><div class="bar"><i style="width:${adh.gymPlanned ? Math.min(100, 100 * adh.gymDone / adh.gymPlanned) : 0}%"></i></div></div>
      <div class="card"><div class="sub">Macros ${adh.macros.hit + adh.macros.mostly} / ${adh.days} days${adh.macros.logged ? ` · ${Math.round(100 * adh.macros.score / adh.days)}%` : ' · not marked'}</div><div class="bar"><i style="width:${Math.min(100, 100 * adh.macros.score / adh.days)}%;background:var(--aqua)"></i></div></div>
    </div>
    <p class="sub">Counts only the days up to today.</p>` : ''}

    <h2>Sets per week by session</h2>
    ${weeklyVolume().some(v => v.Push + v.Pull + v.Legs) ? '<div class="card"><div class="chart sm"><canvas id="volChart"></canvas></div></div><p class="sub">Push, pull and legs should stay roughly level week to week. A dip means missed sessions.</p>' : '<p class="note">Appears once you have logged gym sessions.</p>'}
    <h2>Weekly weight change vs target</h2>
    ${review.some(r => r.change != null) ? '<div class="card"><div class="chart sm"><canvas id="wkChart"></canvas></div></div>' : '<p class="note">This chart appears once you have weigh-ins in two different plan weeks.</p>'}`;
  if (review.some(r => r.change != null)) weeklyChart('wkChart', review);
  if (weeklyVolume().some(v => v.Push + v.Pull + v.Legs)) volumeChart('volChart', weeklyVolume());
}

/* ---------- Progress photos ---------- */
const CHECKPOINTS = (() => { const c = []; for (let k = 0; k < 7; k++) c.push(addDays(PLAN.start, 14 * k)); c.push(PLAN.end); return c; })();
const checkpointLabel = d => d === PLAN.end ? 'Finish' : (d === PLAN.start ? 'Start' : `Week ${weekNumber(d)}`);
const nearestCheckpoint = d => CHECKPOINTS.reduce((best, c) => Math.abs(diffDays(c, d)) < Math.abs(diffDays(best, d)) ? c : best, CHECKPOINTS[0]);
const photoSrc = ph => ph.assetId ? '/_blob/' + ph.assetId : (ph.dataUrl || '');
function nextPhotoDue(today) { return CHECKPOINTS.filter(c => !state.photos[c]).find(c => diffDays(c, today) >= -6) || null; }
async function shrinkImage(file, maxEdge) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, scale = Math.min(1, maxEdge / Math.max(w, h));
  const canvas = document.createElement('canvas'); canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height); return canvas;
}
function kgNear(d) { const near = Object.keys(state.bw).filter(x => Math.abs(diffDays(x, d)) <= 3).sort((a, b) => Math.abs(diffDays(a, d)) - Math.abs(diffDays(b, d)))[0]; return near ? +state.bw[near].kg : null; }
function renderPhotos() {
  const today = todayIso(), due = nextPhotoDue(today), canUpload = !!store.assets || !store.db;
  const filled = CHECKPOINTS.filter(c => state.photos[c]), first = filled[0], last = filled[filled.length - 1];
  CHECKPOINTS.forEach(c => { const ph = state.photos[c]; if (ph && !ph.kg) { const k = kgNear(ph.taken || c); if (k) ph.kg = k; } });
  $('view-photos').innerHTML = `
    ${sec('Progress photos', 'every two weeks')}
    <p class="sub" style="margin:-6px 0 12px">Same spot, same light, same pose. Bodyweight lies week to week; a fortnightly photo tells you whether the bulk is lean.</p>
    ${due ? `<p class="note ${diffDays(due, today) <= 0 ? 'good' : ''}">📷 ${diffDays(due, today) <= 0 ? `Photo due now: <b>${checkpointLabel(due)}</b> (${fDay(due)})` : `Next photo: <b>${checkpointLabel(due)}</b> on ${fDay(due)}, in ${diffDays(due, today)} days`}</p>` : '<p class="note good">All checkpoints have a photo. Nice work.</p>'}
    <div class="card" style="margin-top:12px">
      ${canUpload ? `<div class="row">
        <div class="field"><label for="pSlot">Checkpoint</label><select id="pSlot">${CHECKPOINTS.map(c => `<option value="${c}" ${c === (due || nearestCheckpoint(today)) ? 'selected' : ''}>${checkpointLabel(c)} · ${fShort(c)}${state.photos[c] ? ' (has photo)' : ''}</option>`).join('')}</select></div>
        <div class="field"><label for="pDate">Taken on</label><input type="date" id="pDate" value="${today}"></div>
        <div class="field grow"><label for="pFile">Photo</label><input type="file" id="pFile" accept="image/*"></div>
      </div>
      <div class="row" style="margin-top:10px"><div class="field grow"><label for="pNotes">Notes (optional)</label><input type="text" id="pNotes" placeholder="e.g. morning, fasted, front pose"></div></div>
      <div class="actions"><button class="btn primary" id="pSave">Save photo</button><span class="sub" id="pStatus">${store.assets ? 'Stored with your account.' : (store.db ? '' : 'Stored in this browser only.')}</span></div>` : '<p class="sub">Photos can be added from a view with edit access.</p>'}
    </div>
    ${first && last && first !== last ? `<h2>Then and now</h2><div class="compare">
      <div><img src="${photoSrc(state.photos[first])}" alt="${checkpointLabel(first)}"><div class="cap"><b>${checkpointLabel(first)}</b> · ${fShort(state.photos[first].taken || first)}${state.photos[first].kg ? ` · ${n1(state.photos[first].kg)} kg` : ''}</div></div>
      <div><img src="${photoSrc(state.photos[last])}" alt="${checkpointLabel(last)}"><div class="cap"><b>${checkpointLabel(last)}</b> · ${fShort(state.photos[last].taken || last)}${state.photos[last].kg ? ` · ${n1(state.photos[last].kg)} kg` : ''}</div></div>
    </div>` : ''}
    <h2>Checkpoints</h2>
    <div class="photos">
      ${CHECKPOINTS.map(c => { const ph = state.photos[c]; return `<div class="slot ${c === due ? 'due' : ''}">
        ${ph ? `<img src="${photoSrc(ph)}" alt="${checkpointLabel(c)}" loading="lazy">` : `<div class="ph">${c === due && diffDays(c, today) <= 0 ? 'Due now' : (c > today ? `Due ${fShort(c)}` : 'Missed')}</div>`}
        <div class="meta"><b>${checkpointLabel(c)}</b><span class="sub">${fShort(c)}${ph && ph.kg ? ` · ${n1(ph.kg)} kg` : ''}</span>${ph && ph.notes ? `<span class="sub">${esc(ph.notes)}</span>` : ''}${ph && canUpload ? `<span><button class="btn small danger" data-del-photo="${c}">Delete</button></span>` : ''}</div>
      </div>`; }).join('')}
    </div>`;
  if (canUpload) $('pSave').addEventListener('click', savePhoto);
  document.querySelectorAll('[data-del-photo]').forEach(b => b.addEventListener('click', () => confirmRow(b, async () => {
    const c = b.dataset.delPhoto, ph = state.photos[c]; delete state.photos[c]; await persist('photos');
    if (ph && ph.assetId && store.assets) { try { await store.assets.delete(ph.assetId); } catch (e) {} }
    toast('Photo deleted.'); renderPhotos();
  })));
}
async function savePhoto() {
  const file = $('pFile').files[0], slot = $('pSlot').value, taken = $('pDate').value || todayIso();
  if (!file) { toast('Choose a photo first.'); return; }
  const btn = $('pSave'); btn.disabled = true; $('pStatus').textContent = 'Preparing photo…';
  try {
    const canvas = await shrinkImage(file, store.assets ? 1280 : 640);
    const entry = { taken, kg: kgNear(taken), notes: $('pNotes').value.trim() };
    if (store.assets) { const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85)); $('pStatus').textContent = 'Uploading…'; entry.assetId = (await store.assets.upload(blob, { type: 'image/jpeg' })).id; }
    else entry.dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    const old = state.photos[slot]; state.photos[slot] = entry; await persist('photos');
    if (old && old.assetId && store.assets && old.assetId !== entry.assetId) { try { await store.assets.delete(old.assetId); } catch (e) {} }
    toast(`Photo saved for ${checkpointLabel(slot)}.`); renderPhotos();
  } catch (e) {
    const code = e && e.code; $('pStatus').textContent = '';
    if (code === 'too_large') toast('That photo is too large even after shrinking. Try a smaller one.');
    else if (code === 'quota_or_state') toast('Photo storage is full. Delete an old photo first.');
    else if (code === 'unsupported_type') toast('That file type is not supported. Use a JPEG or PNG.');
    else if (!code) toast('Could not read that image.');
    btn.disabled = false;
  }
}

/* ---------- Data ---------- */
function renderData() {
  const bw = bwSeries().slice().reverse(), gym = Object.entries(state.gym).sort((a, b) => b[1].date.localeCompare(a[1].date));
  $('view-data').innerHTML = `
    ${sec('Export')}
    <div class="card">
      <div class="actions" style="margin-top:0"><button class="btn" data-export="bodyweight">Weigh-ins CSV</button><button class="btn" data-export="gym">Gym sets CSV</button><button class="btn" data-export="macros">Macros CSV</button></div>
      <p class="sub" style="margin:10px 0 0">Plain CSV files that open in Excel or Numbers, and load straight into the Python version of this dashboard. Tip: add this page to your phone's home screen from the browser's share menu and it works like an app.</p>
    </div>
    ${sec('Your data')}
    <p class="sub">Everything you have logged. Delete a wrong entry here, then log it again. To change a gym session, open it and save again.</p>
    <h3 style="margin-top:18px">Gym sessions (${gym.length})</h3>
    ${gym.length ? `<div class="card table tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Session</th><th>Sets</th><th></th></tr></thead><tbody>
      ${gym.map(([id, s]) => `<tr><td>${fDay(s.date)}</td><td>${esc(s.session)}</td><td class="sub">${s.session === 'Rest' ? 'rest day' : `${(s.sets || []).length} sets · ${[...new Set((s.sets || []).map(x => x.exercise))].length} exercises`}</td><td class="num"><button class="btn small" data-open="${esc(id)}">Open</button> <button class="btn small danger" data-del-gym="${esc(id)}">Delete</button></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">No gym sessions yet.</p>'}
    <h3 style="margin-top:18px">Weigh-ins (${bw.length})</h3>
    ${bw.length ? `<div class="card table tblwrap"><table class="tbl"><thead><tr><th>Date</th><th class="num">kg</th><th class="num">Sleep</th><th>Macros</th><th>Notes</th><th></th></tr></thead><tbody>
      ${bw.map(r => `<tr><td>${fDay(r.date)}</td><td class="num">${n1(r.kg)}</td><td class="num">${r.sleep != null ? r.sleep + ' h' : ''}</td><td>${state.macros[r.date] ? MACRO_WORD[state.macros[r.date]] : ''}</td><td class="sub">${esc(r.notes)}</td><td class="num"><button class="btn small danger" data-del-bw="${r.date}">Delete</button></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">No weigh-ins yet.</p>'}`;
  const v = $('view-data');
  v.querySelectorAll('[data-export]').forEach(b => b.addEventListener('click', () => exportCsv(b.dataset.export)));
  v.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { const s = state.gym[b.dataset.open]; gymForm.date = s.date; gymForm.session = s.session; built.gym = false; showTab('gym', true); }));
  v.querySelectorAll('[data-del-gym]').forEach(b => b.addEventListener('click', () => confirmRow(b, async () => { const id = b.dataset.delGym; delete state.gym[id]; await persist('gym', id); toast('Session deleted.'); renderData(); })));
  v.querySelectorAll('[data-del-bw]').forEach(b => b.addEventListener('click', () => confirmRow(b, async () => { delete state.bw[b.dataset.delBw]; await persist('bw'); toast('Weigh-in deleted.'); renderData(); })));
}
function csvOf(kind) {
  const q = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }, line = arr => arr.map(q).join(',');
  if (kind === 'bodyweight') return [line(['date', 'weight_kg', 'sleep_h', 'macros', 'notes'])].concat(Object.keys(state.bw).sort().map(d => line([d, state.bw[d].kg, state.bw[d].sleep ?? '', state.macros[d] ?? '', state.bw[d].notes]))).join('\n');
  if (kind === 'macros') return [line(['date', 'macros'])].concat(Object.keys(state.macros).sort().map(d => line([d, state.macros[d]]))).join('\n');
  const rows = [line(['date', 'session', 'exercise', 'set_number', 'weight_kg', 'reps'])];
  Object.values(state.gym).sort((a, b) => a.date.localeCompare(b.date)).forEach(sess => (sess.sets || []).forEach(x => rows.push(line([sess.date, sess.session, x.exercise, x.set, x.kg, x.reps]))));
  return rows.join('\n');
}
async function exportCsv(kind) {
  const filename = { bodyweight: 'bodyweight.csv', gym: 'gym_sets.csv', macros: 'macros.csv' }[kind], data = csvOf(kind);
  if (store.downloads) { try { await store.downloads.save({ filename, data }); toast(`Saved ${filename}.`); } catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'unavailable' ? 'Downloads are not available in this view.' : 'Could not save the file.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
function confirmRow(btn, fn) {
  if (btn.dataset.armed) { fn().catch(() => {}); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Confirm delete';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 4000);
}

/* ===================== Boot ===================== */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab, true)));
window.addEventListener('hashchange', () => showTab(location.hash.slice(1), false));
let startTab = location.hash.slice(1);
if (!TABS.includes(startTab)) { try { startTab = localStorage.getItem(LS_KEY + '-tab') || 'dashboard'; } catch (e) { startTab = 'dashboard'; } }
showTab(startTab, false);
initStore();
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', () => refresh());
new MutationObserver(() => refresh()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
