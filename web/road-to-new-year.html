<title>Road to New Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#ebeae5; --text:#191b1f; --muted:#626a75; --border:#dedcd6;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e6f0fb;
  --orange:#eb6834; --grey:#8a8983; --good:#0ca30c; --good-soft:#e5f5e5; --warn:#b45309; --warn-soft:#fbeedd; --bad:#d03b3b; --bad-soft:#fbe7e7;
  --grid:rgba(25,27,31,.09); --aqua:#1baf7a;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#151618; --surface:#1e2023; --surface-2:#282b2f; --text:#f0efec; --muted:#a3a8b1; --border:#33363b;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42; --orange:#d95926; --grey:#8f8e89;
    --good:#3fbf3f; --good-soft:#1c2f1c; --warn:#f0a44a; --warn-soft:#3a2a15; --bad:#e66767; --bad-soft:#3b1f1f; --grid:rgba(240,239,236,.10); --aqua:#199e70; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#151618; --surface:#1e2023; --surface-2:#282b2f; --text:#f0efec; --muted:#a3a8b1; --border:#33363b;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d42; --orange:#d95926; --grey:#8f8e89;
  --good:#3fbf3f; --good-soft:#1c2f1c; --warn:#f0a44a; --warn-soft:#3a2a15; --bad:#e66767; --bad-soft:#3b1f1f; --grid:rgba(240,239,236,.10); --aqua:#199e70; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px}
.wrap{max-width:1060px;margin:0 auto;padding-block:14px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:38px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-top:28px;margin-bottom:12px}
h3{font-size:20px;font-weight:600;margin-bottom:8px}
.sub{color:var(--muted);font-size:13px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--grey)}
.chip.on .dot{background:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .value{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .value small{font-size:18px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card.soft{background:var(--surface-2);border-color:transparent}
.note{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.note.good{background:var(--good-soft)} .note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.chart{position:relative;height:320px;max-width:100%}
.chart.sm{height:220px}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.today td{background:var(--accent-soft)}
.tbl tr.current td{font-weight:600}
.tbl .exname{font-weight:500}
.tbl input{width:88px;min-width:70px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 160px}
.field.grow{flex:2 1 240px}
label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);width:100%;font-variant-numeric:tabular-nums}
input[type=range]{padding:0;border:0}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.pb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--good-soft)}
.pb b{font-weight:600}
.star{color:var(--good);font-size:18px;line-height:1}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);font-size:14px;padding:20px 0}
details{margin-top:10px}
summary{cursor:pointer;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.slot.due{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.slot .ph{aspect-ratio:3/4;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.slot img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.slot .meta{padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.slot .meta b{font-weight:600}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.compare .cap{font-size:13px;color:var(--muted);margin-top:6px}
.tbl tr.hint td{padding:2px 8px 10px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.tbl tr.hint td b{color:var(--text);font-weight:600}
.tbl tr.hint .apply{margin-left:6px;padding:1px 8px;font-size:12px}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:4;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:12px}
.timer .clock{font-family:var(--display);font-size:26px;font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
.timer.running .clock{color:var(--accent)}
.timer.done .clock{color:var(--good)}
.timer select{width:auto}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.quick .field{flex:none}
.adh{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.adh .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.adh .bar i{display:block;height:100%;background:var(--accent)}
.feel{display:flex;align-items:center;gap:10px}
.feel output{font-family:var(--display);font-size:26px;font-weight:700;min-width:32px;text-align:center}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
@media (max-width:480px){ h1{font-size:32px} .kpi .value{font-size:28px} .chart{height:260px} }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Road to New Year</h1>
      <div class="sub" id="subline">28 Sep 2026 to 3 Jan 2027 · 14 weeks · lean bulk</div>
    </div>
    <span class="chip" id="storeChip"><span class="dot"></span><span id="storeText">Connecting…</span></span>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="dashboard">Dashboard</button>
    <button class="tab" role="tab" data-tab="gym">Log gym</button>
    <button class="tab" role="tab" data-tab="weight">Log weight</button>
    <button class="tab" role="tab" data-tab="run">Log run</button>
    <button class="tab" role="tab" data-tab="progress">Exercise progress</button>
    <button class="tab" role="tab" data-tab="weekly">Weekly review</button>
    <button class="tab" role="tab" data-tab="photos">Photos</button>
    <button class="tab" role="tab" data-tab="data">Data</button>
  </nav>

  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-gym" hidden></section>
  <section class="view" id="view-weight" hidden></section>
  <section class="view" id="view-run" hidden></section>
  <section class="view" id="view-progress" hidden></section>
  <section class="view" id="view-weekly" hidden></section>
  <section class="view" id="view-photos" hidden></section>
  <section class="view" id="view-data" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
/* ===================== The plan (from the PDF) ===================== */
const DAY = 86400000;
const P = s => new Date(s + 'T00:00:00Z');
const toIso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => toIso(new Date(P(s).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((P(a) - P(b)) / DAY);
const weekday = s => (P(s).getUTCDay() + 6) % 7; // Mon = 0
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmt = (s, o) => P(s).toLocaleDateString('en-GB', { timeZone: 'UTC', ...o });
const fShort = s => fmt(s, { day: 'numeric', month: 'short' });
const fDay = s => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
const fLong = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n1 = x => (Math.round(x * 10) / 10).toFixed(1);
const n2 = x => (Math.round(x * 100) / 100).toFixed(2);
const signed = x => (x >= 0 ? '+' : '') + n2(x);

const LEGS = ['Barbell squats', 'RDL', 'Smith single-leg squats', 'Leg extension', 'Hamstring curl', 'Bike'];
const PLAN = {
  start: '2026-09-28', weeks: 14, startKg: 86, gainPerWeek: 0.25, adjust: 200,
  macros: [['Calories', 3700, 'kcal'], ['Protein', 195, 'g'], ['Fat', 90, 'g'], ['Carbs', 530, 'g']],
  carbWins: ['Oats', 'Bagels', 'Bananas', 'Juice', 'Milk'],
  phases: [
    { name: 'Build', first: 1, last: 2, runs: 5 },
    { name: 'Sharpen', first: 3, last: 4, runs: 5 },
    { name: 'Maintain', first: 5, last: 14, runs: 3 },
  ],
  tips: {
    Build: ['Wed: intervals before legs, or split them by a few hours.', 'Legs A: squats down to 3 sets, skip the bike.', 'Legs B: stop 1-2 reps short of failure.'],
    Sharpen: ['Wed: intervals before legs, or split them by a few hours.', 'Legs A: squats down to 3 sets, skip the bike.', 'Legs B: stop 1-2 reps short of failure.', 'Move to Maintain when you can finish 8 intervals without dying and recover quickly between sprints. Not there by week 5? Stay in Sharpen a bit longer.'],
    Maintain: ['Back to full leg volume: 4 sets of squats, bike included.', 'Push your lifts harder now that running is lighter.', 'Running less now, so if weight climbs faster than 0.25 kg/week, drop about 200 kcal from carbs.'],
  },
  sessions: {
    'Push A': ['Bench press', 'Incline bench', 'Chest fly', 'Shoulder press', 'Cable lateral raise', 'Tricep pushdown', 'Tricep overhead'],
    'Push B': ['Incline bench', 'Chest fly', 'Shoulder press', 'Lateral raise', 'Face pulls', 'Tricep overhead', 'Tricep pushdown'],
    'Pull A': ['Pull-ups', 'Bent-over rows', 'Single-arm DB rows', 'Lat pulldown', 'Cable rows', 'Bicep curl', 'Hammer curl'],
    'Pull B': ['Bent-over rows', 'Tricep pushdown', 'Cable pullovers', 'Bicep curl', 'Cable curl', 'Hammer curl'],
    'Legs A': LEGS, 'Legs B': LEGS,
  },
  gymSchedule: ['Push A', 'Pull A', 'Legs A', 'Push B', 'Pull B', 'Legs B', 'Rest'],
  runTypes: ['Sprints', 'Intervals', 'Shuttles', 'Easy'],
  runSchedule: {
    Build:    { 0: ['Sprints', '8 x 20s'], 1: ['Easy', '30 min'], 2: ['Intervals', '6 x 1 min on / 1 min off'], 4: ['Shuttles', '6 rounds, 60s rest'], 6: ['Easy', '35 min'] },
    Sharpen:  { 0: ['Sprints', '10 x 20s'], 1: ['Easy', '30 min'], 2: ['Intervals', '8 x 1 min on / 1 min off'], 4: ['Shuttles', '8 rounds, 45s rest'], 6: ['Easy', '40 min'] },
    Maintain: { 0: ['Sprints', '8 x 20s + 6 shuttle rounds'], 2: ['Intervals', '8 x 1 min on / 1 min off'], 6: ['Easy', '40 min'] },
  },
  runNotes: ['Warm-up: 10 min easy jog + leg swings.', 'Cool-down: 10 min easy jog.', 'Every session is 30+ minutes including warm-up and cool-down.', 'Shuttle round: sprint 10 m, turn, back, turn, 10 m.', 'Easy runs: if you can\'t chat, slow down.'],
};
PLAN.end = addDays(PLAN.start, PLAN.weeks * 7 - 1);
// How many reps of each hard run the plan asks for, per phase.
PLAN.runReps = {
  Build:    { Sprints: 8,  Intervals: 6, Shuttles: 6 },
  Sharpen:  { Sprints: 10, Intervals: 8, Shuttles: 8 },
  Maintain: { Sprints: 8,  Intervals: 8, Shuttles: 6 },
};
// Progression rules: rep range to work in and the jump to make once you own the top of it.
const ISOLATION = ['Chest fly', 'Cable lateral raise', 'Lateral raise', 'Face pulls', 'Tricep pushdown', 'Tricep overhead', 'Bicep curl', 'Hammer curl', 'Cable curl', 'Cable pullovers', 'Leg extension', 'Hamstring curl'];
const repRange = ex => ex === 'Barbell squats' ? [5, 8] : [8, 12];
const increment = ex => ex === 'Pull-ups' ? 0 : (ISOLATION.includes(ex) ? 1 : 2.5);
PLAN.allExercises = [...new Set(Object.values(PLAN.sessions).flat())];
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const weekNumber = s => s < PLAN.start ? 0 : Math.min(Math.floor(diffDays(s, PLAN.start) / 7) + 1, PLAN.weeks + 1);
const weekDates = w => { const a = addDays(PLAN.start, (w - 1) * 7); return [a, addDays(a, 6)]; };
const phaseForWeek = w => w < 1 ? PLAN.phases[0] : (PLAN.phases.find(p => w >= p.first && w <= p.last) || PLAN.phases[PLAN.phases.length - 1]);
function phaseForDate(s) {
  const ms = state.settings.maintainStart, w = weekNumber(s);
  if (ms && w >= 1) { if (s >= ms) return PLAN.phases[2]; return w <= 2 ? PLAN.phases[0] : PLAN.phases[1]; }
  return phaseForWeek(w);
}
// Where each phase starts on the calendar, honouring the override.
function phaseStarts() {
  const ms = state.settings.maintainStart;
  return [{ name: 'Build', date: PLAN.start }, { name: 'Sharpen', date: weekDates(3)[0] }, { name: 'Maintain', date: ms || weekDates(5)[0] }];
}
const planStatus = s => s < PLAN.start ? 'before' : (s > PLAN.end ? 'after' : 'during');
const targetKg = s => PLAN.startKg + PLAN.gainPerWeek * Math.max(0, diffDays(s, PLAN.start)) / 7;
const gymFor = s => PLAN.gymSchedule[weekday(s)];
const runFor = s => PLAN.runSchedule[phaseForDate(s).name][weekday(s)] || null;
const defaultSets = (ex, phase) => ex === 'Barbell squats' ? (phase === 'Maintain' ? 4 : 3) : 3;
const sessionId = (date, session) => `${date}_${session.replace(/\s+/g, '-')}`;
// Position of an exercise in the plan, so lists always follow the plan's order.
const planOrder = ex => { const i = PLAN.allExercises.indexOf(ex); return i < 0 ? 999 : i; };

/* ===================== State and storage ===================== */
// state.bw  : { "2026-09-28": {kg, notes} }
// state.runs: [ {id, date, type, min, feel, notes} ]
// state.gym : { "2026-09-28_Push-A": {date, session, sets:[{exercise, set, kg, reps}]} }
// state.photos: { "2026-10-12": {assetId | dataUrl, taken, kg, notes} }  keyed by checkpoint date
// state.bw entries may also carry sleep (hours) and sore (1-5); runs may carry done/planned reps.
const state = { bw: {}, runs: [], gym: {}, photos: {}, settings: { maintainStart: null } };
const store = { db: null, assets: null, downloads: null, ready: false };
const LS_KEY = 'road-to-new-year-v1';

function setChip(on, text) {
  const c = document.getElementById('storeChip');
  c.classList.toggle('on', on);
  document.getElementById('storeText').textContent = text;
}
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(state, JSON.parse(raw)); } catch (e) {}
  state.settings = Object.assign({ maintainStart: null }, state.settings || {});
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
async function initStore() {
  let db = null;
  try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
  if (!db) {
    loadLocal(); store.ready = true;
    setChip(false, 'Saved in this browser only');
    refresh(true);
    return;
  }
  store.db = db; store.ready = true;
  setChip(true, 'Saved to your account');
  const onErr = e => { if (e && e.code !== 'unavailable') toast('Live updates stopped. Reload the page to reconnect.'); };
  db.doc('log/bodyweight').onSnapshot(s => { state.bw = (s.exists && s.data().entries) || {}; refresh(); }, onErr);
  db.doc('log/runs').onSnapshot(s => { state.runs = (s.exists && s.data().entries) || []; refresh(); }, onErr);
  db.collection('gym').onSnapshot(qs => { const g = {}; qs.docs.forEach(d => { g[d.id] = d.data(); }); state.gym = g; refresh(); }, onErr);
  db.doc('log/photos').onSnapshot(s => { state.photos = (s.exists && s.data().entries) || {}; refresh(); }, onErr);
  db.doc('log/settings').onSnapshot(s => { state.settings = Object.assign({ maintainStart: null }, s.exists ? s.data() : {}); refresh(true); }, onErr);
  try { store.assets = await window.claude.use('assets'); } catch (e) { store.assets = null; }
  try { store.downloads = await window.claude.use('downloads'); } catch (e) { store.downloads = null; }
  if (activeTab === 'photos') renderPhotos();
}
async function persist(kind, id) {
  if (!store.db) { saveLocal(); return; }
  try {
    if (kind === 'bw') await store.db.doc('log/bodyweight').set({ entries: state.bw });
    else if (kind === 'runs') await store.db.doc('log/runs').set({ entries: state.runs });
    else if (kind === 'photos') await store.db.doc('log/photos').set({ entries: state.photos });
    else if (kind === 'settings') await store.db.doc('log/settings').set(state.settings);
    else if (kind === 'gym') {
      const ref = store.db.collection('gym').doc(id);
      if (state.gym[id]) await ref.set(state.gym[id]); else await ref.delete();
    }
  } catch (e) {
    const code = e && e.code;
    if (code === 'invalid_argument') toast('You can view this page but not save to it.');
    else if (code === 'quota_exceeded') toast('Storage is full. Delete some old sessions on the Data tab.');
    else toast('Could not save. Check your connection and try again.');

  }
}

/* ===================== Analysis ===================== */
function bwSeries() {
  const rows = Object.keys(state.bw).sort().map(d => ({ date: d, kg: +state.bw[d].kg, notes: state.bw[d].notes || '' }));
  rows.forEach((r, i) => {
    const from = addDays(r.date, -6);
    const win = rows.slice(0, i + 1).filter(x => x.date >= from);
    r.avg7 = win.reduce((s, x) => s + x.kg, 0) / win.length;
    r.target = targetKg(r.date);
  });
  return rows;
}
function avgBetween(a, b) {
  const v = Object.keys(state.bw).filter(d => d >= a && d <= b).map(d => +state.bw[d].kg);
  return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
}
function calorieSuggestion(today) {
  const base = PLAN.macros[0][1];
  const thisWeek = avgBetween(addDays(today, -6), today);
  const lastWeek = avgBetween(addDays(today, -13), addDays(today, -7));
  const twoAgo = avgBetween(addDays(today, -20), addDays(today, -14));
  if (thisWeek == null || lastWeek == null) return { kcal: base, tone: '', icon: 'ℹ️', msg: 'Keep weighing in daily. Suggestions start once you have two weeks of data.' };
  const change = thisWeek - lastWeek;
  if (change > PLAN.gainPerWeek + 0.10) return { kcal: base - PLAN.adjust, tone: 'warn', icon: '⬇️', msg: `Gaining ${signed(change)} kg/week, faster than the 0.25 kg target. Drop about ${PLAN.adjust} kcal from carbs.` };
  if (twoAgo != null && Math.abs(thisWeek - twoAgo) < 0.10) return { kcal: base + PLAN.adjust, tone: 'warn', icon: '⬆️', msg: `No real change over the last two weeks. Add about ${PLAN.adjust} kcal (easy carb wins below).` };
  return { kcal: base, tone: 'good', icon: '✅', msg: `Gaining ${signed(change)} kg/week. On track, keep the macros as they are.` };
}
function topSets() {
  const best = {};
  Object.values(state.gym).forEach(sess => (sess.sets || []).forEach(s => {
    if (!(s.reps > 0)) return;
    const kg = +s.kg || 0, reps = +s.reps, score = kg * 1000 + reps;
    const key = s.exercise + '|' + sess.date;
    if (!best[key] || score > best[key].score) best[key] = { date: sess.date, exercise: s.exercise, session: sess.session, kg, reps, score, e1rm: kg * (1 + reps / 30) };
  }));
  const rows = Object.values(best).sort((a, b) => a.exercise.localeCompare(b.exercise) || a.date.localeCompare(b.date));
  const running = {};
  rows.forEach(r => {
    const prev = running[r.exercise];
    r.isPb = prev != null && r.score > prev;
    running[r.exercise] = Math.max(prev ?? -1, r.score);
  });
  return rows;
}
function allTimeBests(top) {
  const m = {};
  top.forEach(r => { if (!m[r.exercise] || r.score > m[r.exercise].score) m[r.exercise] = r; });
  return Object.values(m).sort((a, b) => planOrder(a.exercise) - planOrder(b.exercise));
}
const recentPbs = (top, today, days = 7) => top.filter(r => r.isPb && r.date >= addDays(today, -(days - 1))).sort((a, b) => b.date.localeCompare(a.date));
// What to aim for next time, from the last time you did this exercise.
function progression(exercise, lastSets) {
  if (!lastSets || !lastSets.length || exercise === 'Bike') return null;
  const [lo, hi] = repRange(exercise), inc = increment(exercise);
  const kg = Math.max(...lastSets.map(x => +x.kg || 0));
  const top = lastSets.filter(x => (+x.kg || 0) === kg);
  if (top.every(x => x.reps >= hi)) return inc ? { kg: kg + inc, text: `Try ${n1(kg + inc)} kg × ${lo}-${hi}` } : { kg, text: `Add a rep: aim for ${hi + 1}+` };
  if (top.some(x => x.reps < lo)) return { kg, text: `Stay at ${n1(kg)} kg, get every set to ${lo}+` };
  return { kg, text: `Stay at ${n1(kg)} kg, push toward ${hi} reps` };
}
// Weekly sets by session type (push / pull / legs).
function weeklyVolume() {
  return Array.from({ length: PLAN.weeks }, (_, i) => {
    const [a, b] = weekDates(i + 1), v = { week: i + 1, Push: 0, Pull: 0, Legs: 0 };
    Object.values(state.gym).forEach(sess => { if (sess.date >= a && sess.date <= b) { const g = (sess.session || '').split(' ')[0]; if (v[g] != null) v[g] += (sess.sets || []).filter(x => x.reps > 0).length; } });
    return v;
  });
}
// Sessions and runs done against planned, per phase, counting only days up to today.
function adherence(today) {
  const starts = phaseStarts(), done = sessionsDone();
  return starts.map((ph, i) => {
    const a = ph.date, b = i + 1 < starts.length ? addDays(starts[i + 1].date, -1) : PLAN.end;
    const upto = today < b ? today : b;
    if (a > today) return { name: ph.name, a, b, started: false };
    let gymPlanned = 0, runPlanned = 0;
    for (let d = a; d <= upto; d = addDays(d, 1)) { if (gymFor(d) !== 'Rest') gymPlanned++; if (runFor(d)) runPlanned++; }
    const gymDone = [...done].filter(k => { const [d, sess] = k.split('|'); return d >= a && d <= upto && sess !== 'Rest'; }).length;
    const runDone = state.runs.filter(r => r.date >= a && r.date <= upto).length;
    return { name: ph.name, a, b, started: true, gymPlanned, gymDone, runPlanned, runDone };
  });
}
// Latest hard-run result of a type, for the "ready for Maintain?" check.
function lastRun(type) { return [...state.runs].filter(r => r.type === type).sort((a, b) => b.date.localeCompare(a.date))[0] || null; }
function weighStreak(today) {
  let n = 0; for (let d = today; state.bw[d]; d = addDays(d, -1)) n++;
  if (!n && state.bw[addDays(today, -1)]) { for (let d = addDays(today, -1); state.bw[d]; d = addDays(d, -1)) n++; }
  return n;
}
// Where the 7-day average lands on 3 Jan if the last two weeks' rate continues.
function projection(rows, today) {
  if (rows.length < 8) return null;
  const last = rows[rows.length - 1];
  const ago = rows.filter(r => r.date <= addDays(last.date, -7)).pop();
  if (!ago) return null;
  const perWeek = (last.avg7 - ago.avg7) / (diffDays(last.date, ago.date) / 7);
  return { perWeek, final: last.avg7 + perWeek * diffDays(PLAN.end, last.date) / 7 };
}
function sessionsDone() {
  const set = new Set();
  Object.values(state.gym).forEach(s => { if (s.session === 'Rest' || (s.sets || []).some(x => x.reps > 0)) set.add(s.date + '|' + s.session); });
  return set;
}
function weeklyReview() {
  const done = sessionsDone(); let prev = null; const rows = [];
  for (let w = 1; w <= PLAN.weeks; w++) {
    const [a, b] = weekDates(w), phase = phaseForDate(a);
    const avg = avgBetween(a, b);
    const change = avg != null && prev != null ? avg - prev : null;
    if (avg != null) prev = avg;
    const gymN = [...done].filter(k => { const [d, sess] = k.split('|'); return d >= a && d <= b && sess !== 'Rest'; }).length;
    const runs = state.runs.filter(r => r.date >= a && r.date <= b);
    const feel = runs.length ? runs.reduce((s, r) => s + (+r.feel || 0), 0) / runs.length : null;
    rows.push({ w, a, b, phase: phase.name, avg, change, target: targetKg(addDays(a, 3)), gymN, runN: runs.length, runPlan: phase.runs, feel });
  }
  return rows;
}

// Draws a thin vertical line and a label where each phase starts.
const phasePlugin = {
  id: 'phases',
  afterDraw(chart) {
    const { ctx, chartArea: area, scales: { x } } = chart;
    ctx.save(); ctx.font = `11px ${css('--body')}`; ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
    let lastLabelEnd = -Infinity;
    phaseStarts().forEach(p => {
      const px = x.getPixelForValue(xOf(p.date));
      if (px < area.left || px > area.right) return;
      ctx.beginPath(); ctx.moveTo(px, area.top); ctx.lineTo(px, area.bottom); ctx.stroke();
      const w = ctx.measureText(p.name).width;
      if (px + 4 > lastLabelEnd && px + 4 + w < area.right) { ctx.fillText(p.name, px + 4, area.top + 11); lastLabelEnd = px + 4 + w + 8; }
    });
    ctx.restore();
  },
};

/* ---------- Log gym ---------- */

  $('view-gym').innerHTML = `

      <div id="gResult" class="stack" style="margin-top:12px"></div>

  // Changing the date switches to that day's planned session (a rest day keeps the current pick).

// ---- Rest timer ----
const timer = { running: false, left: 0, handle: null };
function fmtClock(sec) { return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
function startTimer() {
  const el = $('timer'); if (!el) return;
  clearInterval(timer.handle); timer.left = +$('tLen').value; timer.running = true;
  el.classList.add('running'); el.classList.remove('done'); $('tStart').textContent = 'Stop'; $('tClock').textContent = fmtClock(timer.left);
  timer.handle = setInterval(() => {
    timer.left--; const c = $('tClock'); if (!c) { clearInterval(timer.handle); timer.running = false; return; }
    c.textContent = fmtClock(Math.max(0, timer.left));
    if (timer.left <= 0) { stopTimer(true); }
  }, 1000);
}
function stopTimer(finished) {
  clearInterval(timer.handle); timer.running = false;
  const el = $('timer'); if (!el) return;
  el.classList.remove('running'); $('tStart').textContent = 'Start rest';
  if (finished) { el.classList.add('done'); $('tClock').textContent = 'Go'; toast('Rest over. Next set.'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
  else $('tClock').textContent = fmtClock(+$('tLen').value);
}
function fillGymRows() {
  const { date, session } = gymForm, phase = phaseForDate(date);
  const id = sessionId(date, session);
  const saved = state.gym[id];
  if (session === 'Rest') {
    $('gInfo').textContent = `${fDay(date)} · ${phase.name} phase · rest day. Nothing to lift; mark it done so the week shows complete.`;
    $('gTable').innerHTML = saved ? '<p class="note good">Rest day logged ✅</p>' : '<p class="sub">No exercises today. Easy run on Sundays only.</p>';
    $('gSave').textContent = saved ? 'Undo rest day' : 'Mark rest day done';
    gymForm.rows = []; gymForm.dirty = false;
    return;
  }
  $('gSave').textContent = 'Save session';
  let source = saved, sourceLabel = '';
  const prev = Object.values(state.gym).filter(s => s.session === session && s.date < date).sort((a, b) => b.date.localeCompare(a.date))[0];
  gymForm.last = prev || null;
  if (!source) {
    if (prev) { source = prev; sourceLabel = `Pre-filled from your last ${session} on ${fShort(prev.date)}. Targets below each exercise.`; }
    else sourceLabel = `First time logging ${session}. Fill in what you lift.`;
  } else sourceLabel = `This session is already saved for ${fShort(date)}. Saving again replaces it.`;
  $('gInfo').textContent = `${fDay(date)} · ${phase.name} phase · planned session: ${gymFor(date)}. ${sourceLabel}`;
  gymForm.rows = []; gymForm.dirty = false;
  PLAN.sessions[session].forEach(ex => {
    const sets = (source && source.sets || []).filter(s => s.exercise === ex);
    const n = Math.max(defaultSets(ex, phase.name), sets.length);
    for (let i = 1; i <= n; i++) { const m = sets.find(s => +s.set === i); gymForm.rows.push({ exercise: ex, set: i, kg: m ? m.kg : '', reps: m ? m.reps : '' }); }
  });

}
function renderGymRows() {
  let html = '<table class="tbl"><thead><tr><th>Exercise</th><th>Set</th><th>Weight (kg)</th><th>Reps</th></tr></thead><tbody>';
  gymForm.rows.forEach((r, i) => {
    const firstOfEx = i === 0 || gymForm.rows[i - 1].exercise !== r.exercise;
    const lastOfEx = i === gymForm.rows.length - 1 || gymForm.rows[i + 1].exercise !== r.exercise;
    if (firstOfEx && gymForm.last) {

    }

      <td><input type="number" inputmode="decimal" step="0.5" min="0" data-i="${i}" data-k="kg" value="${r.kg === '' ? '' : r.kg}" placeholder="kg"></td>
      <td><input type="number" inputmode="numeric" step="1" min="0" data-i="${i}" data-k="reps" value="${r.reps === '' ? '' : r.reps}" placeholder="reps"></td></tr>`;
  });
  $('gTable').innerHTML = html + '</tbody></table>';
  $('gTable').querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => { gymForm.rows[+e.target.dataset.i][e.target.dataset.k] = e.target.value; gymForm.dirty = true; });
    // Entering reps means the set is done: start the rest clock.

    // Enter jumps to the next box, like a spreadsheet.

    $('gTable').querySelectorAll(`input[data-k="kg"]`).forEach(inp => { if (gymForm.rows[+inp.dataset.i].exercise === ex) inp.value = kg; });

  }));
}
async function markRest(date, undo) {
  const id = sessionId(date, 'Rest');

}
async function saveGym() {
  const { date, session } = gymForm;
  if (session === 'Rest') { await markRest(date, !!state.gym[sessionId(date, 'Rest')]); fillGymRows(); return; }
  const sets = gymForm.rows.filter(r => +r.reps > 0).map(r => ({ exercise: r.exercise, set: r.set, kg: +r.kg || 0, reps: Math.round(+r.reps) }));
  if (!sets.length) { toast('Nothing to save. Enter reps for at least one set.'); return; }
  const id = sessionId(date, session);

  $('gSave').disabled = false;
  const pbs = topSets().filter(r => r.date === date && r.isPb && r.score > (before[r.exercise] ?? -1));

  $('gResult').innerHTML = pbs.map(r => `<div class="pb"><span class="star">★</span><span>New best: <b>${esc(r.exercise)}</b> ${n1(r.kg)} kg × ${r.reps}</span></div>`).join('');
  fillGymRows();
}

  const inPlan = d => d >= PLAN.start && d <= PLAN.end;

  const gymTotal = [...done].filter(k => inPlan(k.split('|')[0]) && k.split('|')[1] !== 'Rest').length, runTotal = state.runs.filter(r => inPlan(r.date)).length;
  const cell = v => v == null ? '<span class="sub">–</span>' : v;
  $('view-weekly').innerHTML = `
    <h2>Weekly review</h2>
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><div class="label">Change since week 1</div><div class="value">${startAvg != null && latestAvg != null ? signed(latestAvg - startAvg) + ' <small>kg</small>' : '–'}</div></div>
      <div class="kpi"><div class="label">Gym sessions done</div><div class="value">${gymTotal}</div></div>
      <div class="kpi"><div class="label">Runs done</div><div class="value">${runTotal}</div></div>
      <div class="kpi"><div class="label">Current week</div><div class="value">${wk < 1 ? 'Not started' : (wk > PLAN.weeks ? 'Finished' : `${wk} <small>/ 14</small>`)}</div></div>

      ${review.map(r => `<tr class="${r.w === wk ? 'current' : ''}"><td>${r.w}${r.w === wk ? ' ◀' : ''}</td><td>${fShort(r.a)} – ${fShort(r.b)}</td><td>${r.phase}</td><td class="num">${cell(r.avg == null ? null : n2(r.avg))}</td><td class="num">${cell(r.change == null ? null : signed(r.change))}</td><td class="num">${n2(r.target)}</td><td class="num">${r.gymN} / 6</td><td class="num">${r.runN} / ${r.runPlan}</td><td class="num">${cell(r.feel == null ? null : n1(r.feel))}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="sub">Gym sessions count once per day per session. Runs count against the phase's plan: 5 a week in Build and Sharpen, 3 in Maintain.</p>

    <h2>Adherence by phase</h2>
    <div class="adh">${adherence(today).map(a => a.started ? `<div class="card">
        <div class="exhead"><h3 style="margin:0">${a.name}</h3><span class="sub">${fShort(a.a)} – ${fShort(a.b)}</span></div>

        <div class="sub" style="margin-top:8px">Runs ${a.runDone} / ${a.runPlanned}${a.runPlanned ? ` · ${Math.round(100 * a.runDone / a.runPlanned)}%` : ''}</div><div class="bar"><i style="width:${a.runPlanned ? Math.min(100, 100 * a.runDone / a.runPlanned) : 0}%;background:var(--orange)"></i></div>
      </div>` : `<div class="card soft"><h3 style="margin:0">${a.name}</h3><div class="sub">Starts ${fShort(a.a)}</div></div>`).join('')}</div>
    <p class="sub">Planned counts only the days up to today, so a phase you're halfway through isn't marked down for the days still to come.</p>

    ${(() => { const iv = lastRun('Intervals'), sp = lastRun('Sprints'); if (!iv && !sp) return '';
      const ready = iv && iv.planned && iv.done >= 8 && iv.feel >= 6;
      return `<h2>Ready for Maintain?</h2><p class="note ${ready ? 'good' : ''}">${ready ? '✅ Last intervals: all 8 done and it felt OK. The plan says you can move to Maintain.' : 'The plan\'s test: finish 8 intervals without dying and recover quickly between sprints.'}
      ${iv ? `<br>Last intervals (${fShort(iv.date)}): ${iv.planned ? `${iv.done}/${iv.planned} done, ` : ''}felt ${iv.feel}/10.` : ''}${sp ? `<br>Last sprints (${fShort(sp.date)}): ${sp.planned ? `${sp.done}/${sp.planned} done, ` : ''}felt ${sp.feel}/10.` : ''}
      ${state.settings.maintainStart ? `<br>Maintain set to start ${fDay(state.settings.maintainStart)}.` : '<br>When you\'re ready, set the Maintain start date on the Data tab.'}</p>`; })()}

    <h2>Sets per week by session</h2>
    ${weeklyVolume().some(v => v.Push + v.Pull + v.Legs) ? '<div class="card"><div class="chart sm"><canvas id="volChart"></canvas></div></div><p class="sub">Legs should dip in Build and Sharpen (3 sets of squats, no bike) and come back in Maintain.</p>' : '<p class="note">Appears once you have logged gym sessions.</p>'}

/* ---------- Progress photos (every two weeks) ---------- */
// Checkpoints: the start of week 1, then every two weeks, then the final day.
const CHECKPOINTS = (() => { const c = []; for (let k = 0; k < 7; k++) c.push(addDays(PLAN.start, 14 * k)); c.push(PLAN.end); return c; })();
const checkpointLabel = d => d === PLAN.end ? 'Finish' : (d === PLAN.start ? 'Start' : `Week ${weekNumber(d)}`);
const nearestCheckpoint = d => CHECKPOINTS.reduce((best, c) => Math.abs(diffDays(c, d)) < Math.abs(diffDays(best, d)) ? c : best, CHECKPOINTS[0]);
const photoSrc = ph => ph.assetId ? '/_blob/' + ph.assetId : (ph.dataUrl || '');
function nextPhotoDue(today) {
  const missing = CHECKPOINTS.filter(c => !state.photos[c]);
  const due = missing.find(c => diffDays(c, today) >= -6) || null;   // a slot stays "open" for a week after its date
  return due;
}
// Shrink a photo before storing it: long edge 1280px, JPEG. Keeps uploads small and fast.
async function shrinkImage(file, maxEdge, quality) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  const w = bmp.width, h = bmp.height, scale = Math.min(1, maxEdge / Math.max(w, h));
  const canvas = document.createElement('canvas'); canvas.width = Math.round(w * scale); canvas.height = Math.round(h * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return canvas;
}
function renderPhotos() {
  const today = todayIso(), due = nextPhotoDue(today), canUpload = !!store.assets || !store.db;
  const filled = CHECKPOINTS.filter(c => state.photos[c]);
  const first = filled[0], last = filled[filled.length - 1];
  const kgAt = d => { const near = Object.keys(state.bw).filter(x => Math.abs(diffDays(x, d)) <= 3).sort((a, b) => Math.abs(diffDays(a, d)) - Math.abs(diffDays(b, d)))[0]; return near ? +state.bw[near].kg : null; };
  $('view-photos').innerHTML = `
    <h2>Progress photos</h2>
    <p class="sub" style="margin:-6px 0 12px">One photo every two weeks, same spot, same light, same pose. Bodyweight lies week to week; a fortnightly photo tells you whether the bulk is lean.</p>
    ${due ? `<p class="note ${diffDays(due, today) <= 0 ? 'good' : ''}">📷 ${diffDays(due, today) <= 0 ? `Photo due now: <b>${checkpointLabel(due)}</b> (${fDay(due)})` : `Next photo: <b>${checkpointLabel(due)}</b> on ${fDay(due)}, in ${diffDays(due, today)} days`}</p>` : '<p class="note good">All checkpoints have a photo. Nice work.</p>'}
    <div class="card" style="margin-top:12px">
      ${canUpload ? `<div class="row">
        <div class="field"><label for="pSlot">Checkpoint</label><select id="pSlot">${CHECKPOINTS.map(c => `<option value="${c}" ${c === (due || nearestCheckpoint(today)) ? 'selected' : ''}>${checkpointLabel(c)} · ${fShort(c)}${state.photos[c] ? ' (has photo)' : ''}</option>`).join('')}</select></div>
        <div class="field"><label for="pDate">Taken on</label><input type="date" id="pDate" value="${today}"></div>
        <div class="field grow"><label for="pFile">Photo</label><input type="file" id="pFile" accept="image/*"></div>
      </div>
      <div class="row" style="margin-top:10px"><div class="field grow"><label for="pNotes">Notes (optional)</label><input type="text" id="pNotes" placeholder="e.g. morning, fasted, front pose"></div></div>
      <div class="actions"><button class="btn primary" id="pSave">Save photo</button><span class="sub" id="pStatus">${store.assets ? 'Stored with your account.' : (store.db ? '' : 'Stored in this browser only.')}</span></div>`
      : '<p class="sub">Photos can be added from a view with edit access.</p>'}
    </div>
    ${first && last && first !== last ? `<h2>Then and now</h2><div class="compare">
      <div><img src="${photoSrc(state.photos[first])}" alt="${checkpointLabel(first)}"><div class="cap"><b>${checkpointLabel(first)}</b> · ${fShort(state.photos[first].taken || first)}${state.photos[first].kg ? ` · ${n1(state.photos[first].kg)} kg` : ''}</div></div>
      <div><img src="${photoSrc(state.photos[last])}" alt="${checkpointLabel(last)}"><div class="cap"><b>${checkpointLabel(last)}</b> · ${fShort(state.photos[last].taken || last)}${state.photos[last].kg ? ` · ${n1(state.photos[last].kg)} kg` : ''}</div></div>
    </div>` : ''}
    <h2>Checkpoints</h2>
    <div class="photos">
      ${CHECKPOINTS.map(c => { const ph = state.photos[c]; return `<div class="slot ${c === due ? 'due' : ''}">
        ${ph ? `<img src="${photoSrc(ph)}" alt="${checkpointLabel(c)}" loading="lazy">` : `<div class="ph">${c === due && diffDays(c, today) <= 0 ? 'Due now' : (c > today ? `Due ${fShort(c)}` : 'Missed')}</div>`}
        <div class="meta"><b>${checkpointLabel(c)}</b><span class="sub">${fShort(c)}${ph && ph.kg ? ` · ${n1(ph.kg)} kg` : ''}</span>${ph && ph.notes ? `<span class="sub">${esc(ph.notes)}</span>` : ''}${ph && canUpload ? `<span><button class="btn small danger" data-del-photo="${c}">Delete</button></span>` : ''}</div>
      </div>`; }).join('')}
    </div>`;
  if (canUpload) $('pSave').addEventListener('click', savePhoto);
  document.querySelectorAll('[data-del-photo]').forEach(b => b.addEventListener('click', () => confirmRow(b, async () => {
    const c = b.dataset.delPhoto, ph = state.photos[c];
    delete state.photos[c];
    await persist('photos');
    if (ph && ph.assetId && store.assets) { try { await store.assets.delete(ph.assetId); } catch (e) {} }
    toast('Photo deleted.'); renderPhotos();
  })));
  // A photo card is a natural place to record the weight the day it was taken.
  CHECKPOINTS.forEach(c => { const ph = state.photos[c]; if (ph && !ph.kg) { const k = kgAt(ph.taken || c); if (k) ph.kg = k; } });
}
async function savePhoto() {
  const file = $('pFile').files[0], slot = $('pSlot').value, taken = $('pDate').value || todayIso();
  if (!file) { toast('Choose a photo first.'); return; }
  const btn = $('pSave'); btn.disabled = true; $('pStatus').textContent = 'Preparing photo…';
  try {
    const canvas = await shrinkImage(file, store.assets ? 1280 : 640, 0.85);
    const near = Object.keys(state.bw).filter(x => Math.abs(diffDays(x, taken)) <= 3).sort((a, b) => Math.abs(diffDays(a, taken)) - Math.abs(diffDays(b, taken)))[0];
    const entry = { taken, kg: near ? +state.bw[near].kg : null, notes: $('pNotes').value.trim() };
    if (store.assets) {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
      $('pStatus').textContent = 'Uploading…';
      const up = await store.assets.upload(blob, { type: 'image/jpeg' });
      entry.assetId = up.id;
    } else {
      entry.dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    }
    const old = state.photos[slot];
    state.photos[slot] = entry;
    await persist('photos');
    if (old && old.assetId && store.assets && old.assetId !== entry.assetId) { try { await store.assets.delete(old.assetId); } catch (e) {} }
    toast(`Photo saved for ${checkpointLabel(slot)}.`);
    renderPhotos();
  } catch (e) {
    const code = e && e.code;
    $('pStatus').textContent = '';
    if (code === 'too_large') toast('That photo is too large even after shrinking. Try a smaller one.');
    else if (code === 'quota_or_state') toast('Photo storage is full. Delete an old photo first.');
    else if (code === 'unsupported_type') toast('That file type is not supported. Use a JPEG or PNG.');
    else if (!code) toast('Could not read that image.');
    btn.disabled = false;
  }
}

// ---- CSV export ----
function csvOf(kind) {
  const q = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const line = arr => arr.map(q).join(',');
  if (kind === 'bodyweight') return [line(['date', 'weight_kg', 'sleep_h', 'soreness', 'notes'])].concat(Object.keys(state.bw).sort().map(d => line([d, state.bw[d].kg, state.bw[d].sleep ?? '', state.bw[d].sore ?? '', state.bw[d].notes]))).join('\n');
  if (kind === 'runs') return [line(['date', 'run_type', 'duration_min', 'feel', 'reps_done', 'reps_planned', 'notes'])].concat([...state.runs].sort((a, b) => a.date.localeCompare(b.date)).map(r => line([r.date, r.type, r.min, r.feel, r.done ?? '', r.planned ?? '', r.notes]))).join('\n');
  const rows = [line(['date', 'session', 'exercise', 'set_number', 'weight_kg', 'reps'])];
  Object.values(state.gym).sort((a, b) => a.date.localeCompare(b.date)).forEach(sess => (sess.sets || []).forEach(x => rows.push(line([sess.date, sess.session, x.exercise, x.set, x.kg, x.reps]))));
  return rows.join('\n');
}
async function exportCsv(kind) {
  const filename = { bodyweight: 'bodyweight.csv', gym: 'gym_sets.csv', runs: 'runs.csv' }[kind], data = csvOf(kind);
  if (store.downloads) {
    try { await store.downloads.save({ filename, data }); toast(`Saved ${filename}.`); }
    catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'unavailable' ? 'Downloads are not available in this view.' : 'Could not save the file.'); }
    return;
  }
  // Outside the Claude viewer: an ordinary browser download.
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}
// Two-tap delete: the first tap turns the button into "Confirm", the second deletes.
function confirmRow(btn, fn) {
  if (btn.dataset.armed) { fn().catch(() => {}); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Confirm delete';
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 4000);
}
